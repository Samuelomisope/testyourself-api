name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    env:
      # Dummy value: prisma.config.ts calls env("DATABASE_URL") at load time
      # for ANY prisma command, including generate/validate — but those two
      # commands never actually open a connection, so a fake URL is fine here.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      # Uncomment once you have a test suite worth running in CI
      # - name: Test
      #   run: npm run test
